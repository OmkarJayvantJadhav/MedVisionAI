# Skin-lesion classifier configuration.
# Relative paths resolve against the ml/ directory. Any value can be overridden
# with an environment variable: MEDVISION__<SECTION>__<KEY>, for example
# MEDVISION__TRAINING__EPOCHS=5 or MEDVISION__PATHS__DATA_DIR=/mnt/skin.

seed: 42

paths:
  data_dir: data/skin            # contains Train/, Validation/, Test/ with one folder per class
  output_dir: outputs
  model_dir: artifacts

data:
  image_size: 224
  batch_size: 32
  cache: true
  cache_dir: null                # set a folder to cache on disk instead of in RAM
  shuffle_buffer_size: 1024
  split_ratios: [0.80, 0.10, 0.10]
  near_duplicate_max_distance: 16  # dHash Hamming distance (out of 256 bits)

augmentation:
  horizontal_flip: true
  vertical_flip: false           # lesions have no "up"; true is valid for dermoscopy
  rotation: 0.15                 # fraction of a full turn each way; 0.5 = any angle
  zoom: 0.20
  contrast: 0.15
  brightness: 0.0                # fraction of the 0-255 range, both directions
  saturation: 0.0                # 0.2 = mild saturation changes around the original

model:
  backbone: efficientnetb0       # efficientnetb0 | efficientnetv2s | convnext_tiny | mobilenetv2
  dropout: 0.30
  pretrained: true               # ImageNet weights; false only for smoke tests

training:
  epochs: 50
  learning_rate: 1.0e-4
  fine_tune_epochs: 15
  fine_tune_learning_rate: 1.0e-5
  fine_tune_layers: 40           # final backbone layers unfrozen in stage 2; 1000 = all
  class_weighting: sqrt          # none | balanced | sqrt
  loss: crossentropy             # crossentropy | focal
  focal_gamma: 2.0               # focal loss only; 0 equals cross-entropy
  lr_schedule: plateau           # plateau (ReduceLROnPlateau) | cosine (per stage)
  warmup_epochs: 0               # cosine only: linear warm-up at the start of each stage
  mixed_precision: true
  early_stopping_patience: 10
  reduce_lr_patience: 4
  reduce_lr_factor: 0.5
  min_learning_rate: 1.0e-7

evaluation:
  # Malignant and pre-malignant classes used for the safety-weighted selection metric.
  malignant_classes:
    - Actinic Keratosis
    - Basal Cell Carcinoma
    - Melanoma
    - Squamous Cell Carcinoma
  calibration_bins: 15
  target_malignant_recall: 0.90    # fits the malignant-probability threshold
  target_confident_accuracy: 0.85  # fits the low-confidence threshold
  target_in_distribution_acceptance: 0.99  # fits the out-of-distribution threshold
  ood_shrinkage: 0.01
