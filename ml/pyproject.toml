[project]
name = "medvision-ml"
version = "0.1.0"
description = "Training, evaluation, calibration and export pipeline for MedVision AI."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "pillow>=10.3",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "tensorflow>=2.18,<2.21",
    "tf2onnx>=1.17.0",
]

[project.scripts]
medvision-ml = "medvision_ml.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medvision_ml"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
# The parity tests import the backend's TensorFlow-free inference core.
mypy_path = "../backend"

[[tool.mypy.overrides]]
# These libraries ship without type information.
module = ["tensorflow.*", "keras.*", "sklearn.*", "tf2onnx.*", "onnx.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not data and not model'"
filterwarnings = [
  # Raised inside Keras when converting tensors under NumPy 2.
  "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]
markers = [
  "data: needs the training dataset (skipped in CI)",
  "model: needs real model artifacts",
  "slow: long-running test",
]
