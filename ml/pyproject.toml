[project]
name = "medvision-ml"
version = "0.1.0"
description = "Training, evaluation, calibration and export pipeline for MedVision AI."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medvision_ml"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not data and not model'"
markers = [
  "data: needs the training dataset (skipped in CI)",
  "model: needs real model artifacts",
  "slow: long-running test",
]
