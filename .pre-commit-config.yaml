repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  # Lint, format and type checks use the versions locked in each package, so
  # hooks and CI always agree.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + format check)
        entry: make lint
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: make typecheck
        language: system
        pass_filenames: false
        types: [python]
