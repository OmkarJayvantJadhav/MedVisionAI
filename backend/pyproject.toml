[project]
name = "medvision-backend"
version = "0.1.0"
description = "FastAPI inference service for MedVision AI (ONNX Runtime, no TensorFlow)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not data and not model'"
markers = [
  "data: needs the training dataset (skipped in CI)",
  "model: needs real model artifacts",
  "slow: long-running test",
]
