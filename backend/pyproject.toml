[project]
name = "medvision-backend"
version = "0.1.0"
description = "FastAPI inference service for MedVision AI (ONNX Runtime, no TensorFlow)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "pillow>=10.3",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.11",
  "onnx>=1.16",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "onnx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not data and not model'"
filterwarnings = [
  # Raised by FastAPI's TestClient import; it does not affect the tests.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
  "data: needs the training dataset (skipped in CI)",
  "model: needs real model artifacts",
  "slow: long-running test",
]
